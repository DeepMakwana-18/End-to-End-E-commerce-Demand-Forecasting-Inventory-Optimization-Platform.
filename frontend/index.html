<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=titan" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('titan-scai-storage') || '{}').state;
        const theme = saved?.theme === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : saved?.theme;
        document.documentElement.className = theme === 'dark' ? 'dark' : 'light';
      } catch { /* Keep the default light theme. */ }
      if (location.pathname.startsWith('/app')) document.documentElement.dataset.appBoot = 'true';
    </script>
    <style>
      #boot-loader { display: none; }
      html[data-app-boot="true"] #boot-loader {
        position: fixed; inset: 0; z-index: 1001; display: grid; place-items: center;
        min-height: 100dvh; padding: 2rem; box-sizing: border-box;
        background: #F3F4F6; color: #181B22; font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      html.dark[data-app-boot="true"] #boot-loader { background: #0a0a0a; color: #fafaf9; }
      .boot-content { display: flex; flex-direction: column; align-items: center; text-align: center; }
      .boot-mark { width: 72px; height: 72px; margin-bottom: 1.25rem; color: inherit; display: block; overflow: visible; }
      .boot-mark .orbit { transform-origin: 24px 24px; animation: boot-orbit-rotate 1.4s linear infinite; }
      .boot-mark .track { fill: none; stroke: currentColor; stroke-width: 1.2; opacity: 0.18; }
      .boot-mark .sat { transform-origin: 24px 24px; }
      .boot-mark .sat-1 { transform: rotate(-90deg) translateX(17px); }
      .boot-mark .sat-2 { transform: rotate(30deg) translateX(17px); }
      .boot-mark .sat-3 { transform: rotate(150deg) translateX(17px); }
      .boot-mark .ring { fill: none; stroke: currentColor; stroke-width: 2.4; }
      .boot-mark .core { fill: currentColor; }
      #boot-loader[data-boot-error="true"] .boot-mark .orbit { animation: none; }
      .boot-name { font-size: 1.125rem; font-weight: 800; letter-spacing: 0.14em; line-height: 1.2; }
      .boot-status { margin: 0.75rem 0 0; font-size: 0.8125rem; line-height: 1.5; color: #525866; font-weight: 500; }
      html.dark .boot-status { color: #a1a1aa; }
      .boot-retry { display: none; margin-top: 1.25rem; padding: 0.5625rem 1.125rem; border-radius: 0.625rem; border: 0; background: #2454D6; color: #ffffff; font-size: 0.8125rem; font-weight: 600; cursor: pointer; }
      #boot-loader[data-boot-error="true"] .boot-retry { display: inline-flex; align-items: center; }
      @keyframes boot-orbit-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @media (max-width: 600px) { .boot-mark { width: 64px; height: 64px; } }
      html[data-page-hidden="true"] .boot-mark .orbit { animation-play-state: paused !important; }
      @media (prefers-reduced-motion: reduce) { .boot-mark .orbit { animation: none !important; } }
    </style>
    <meta name="description" content="AI-Powered E-commerce Demand Forecasting & Inventory Optimization Platform - Enterprise-grade analytics for smarter inventory decisions." />
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <title>Titan AI — Supply Chain Intelligence</title>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-live="polite" aria-label="Opening your TITAN AI workspace">
      <div class="boot-content">
        <svg class="boot-mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g class="orbit">
            <circle class="track" cx="24" cy="24" r="17" />
            <g class="sat sat-1"><circle class="ring" cx="24" cy="24" r="4" /></g>
            <g class="sat sat-2"><circle class="ring" cx="24" cy="24" r="4" /></g>
            <g class="sat sat-3"><circle class="ring" cx="24" cy="24" r="4" /></g>
          </g>
          <circle class="core" cx="24" cy="24" r="7" />
        </svg>
        <div class="boot-name">TITAN AI</div>
        <p id="boot-status-text" class="boot-status">Opening your workspace.</p>
        <button id="boot-retry-btn" class="boot-retry" type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.__titanBootError = function () {
        var el = document.getElementById('boot-loader');
        var status = document.getElementById('boot-status-text');
        if (el) el.setAttribute('data-boot-error', 'true');
        if (status) status.textContent = 'We couldn\u2019t open your workspace.';
      };
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__titanBootError && window.__titanBootError()"></script>
  </body>
</html>
