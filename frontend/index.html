<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=titan" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('titan-scai-storage') || '{}').state;
        const theme = saved?.theme === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : saved?.theme;
        document.documentElement.className = theme === 'dark' ? 'dark' : 'light';
      } catch { /* Keep the default light theme. */ }
      if (location.pathname.startsWith('/app')) document.documentElement.dataset.appBoot = 'true';
    </script>
    <style>
      #boot-loader { display: none; }
      html[data-app-boot="true"] #boot-loader {
        position: fixed; inset: 0; z-index: 1001; display: grid; place-items: center;
        min-height: 100dvh; padding: 2rem; box-sizing: border-box;
        background: #fafaf9; color: #0a0a0a; font-family: Inter, system-ui, sans-serif;
      }
      html.dark #boot-loader { background: #0a0a0a; color: #fafaf9; }
      .boot-content { display: flex; flex-direction: column; align-items: center; text-align: center; animation: boot-appear 220ms ease-out 90ms both; }
      .boot-mark { position: relative; display: grid; place-items: center; width: 120px; height: 120px; margin-bottom: 1.5rem; }
      .boot-logo { display: block; width: 96px; height: 96px; background: currentColor; mask: url('/favicon.svg?v=titan') center / contain no-repeat; }
      .boot-orbit { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: #1e3fc8; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 48 298; animation: boot-rotate 2.4s linear infinite; }
      html.dark .boot-orbit { stroke: #60a5fa; }
      .boot-name { font-size: 1.25rem; font-weight: 800; letter-spacing: .14em; line-height: 1.2; }
      .boot-subtitle { margin-top: .4rem; font-size: .75rem; font-weight: 500; letter-spacing: .025em; color: #52525b; }
      .boot-status { margin: 2rem 0 0; font-size: .8125rem; line-height: 1.5; color: #52525b; }
      html.dark .boot-subtitle, html.dark .boot-status { color: #d4d4d8; }
      @keyframes boot-appear { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-rotate { to { transform: rotate(360deg); } }
      @media (max-width: 600px) { .boot-mark { width: 104px; height: 104px; } .boot-logo { width: 80px; height: 80px; } }
      @media (prefers-reduced-motion: reduce) { .boot-content, .boot-orbit { animation: none; } .boot-orbit { display: none; } }
    </style>
    <meta name="description" content="AI-Powered E-commerce Demand Forecasting & Inventory Optimization Platform - Enterprise-grade analytics for smarter inventory decisions." />
    <meta name="theme-color" content="#09090b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <title>Titan AI — Supply Chain Intelligence</title>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-label="Opening your TITAN AI workspace">
      <div class="boot-content">
        <div class="boot-mark" aria-hidden="true">
          <svg class="boot-orbit" viewBox="0 0 120 120"><circle cx="60" cy="60" r="55" /></svg>
          <span class="boot-logo"></span>
        </div>
        <div class="boot-name">TITAN AI</div>
        <div class="boot-subtitle">Supply Chain Intelligence</div>
        <p class="boot-status">Opening your workspace</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
