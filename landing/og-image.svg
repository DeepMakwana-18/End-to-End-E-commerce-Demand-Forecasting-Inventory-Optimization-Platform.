<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08141b"/>
      <stop offset="100%" stop-color="#14261f"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d854e" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#66d7a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bcf58d" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#24573e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#08141b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="120" x2="1120" y2="120"/>
    <line x1="80" y1="240" x2="1120" y2="240"/>
    <line x1="80" y1="360" x2="1120" y2="360"/>
    <line x1="80" y1="480" x2="1120" y2="480"/>
    <line x1="300" y1="80" x2="300" y2="550"/>
    <line x1="600" y1="80" x2="600" y2="550"/>
    <line x1="900" y1="80" x2="900" y2="550"/>
  </g>

  <!-- Forecast wave graphic on right -->
  <path d="M 620 400 Q 720 370 820 320 T 1000 240 T 1120 180" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="1000" cy="240" r="7" fill="#bcf58d"/>
  <circle cx="1000" cy="240" r="15" fill="none" stroke="#bcf58d" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Brand Mark -->
  <g transform="translate(100, 100)">
    <rect width="52" height="52" rx="12" fill="#152822" stroke="#2c5a45" stroke-width="1.5"/>
    <circle cx="26" cy="16" r="5" fill="none" stroke="#f6f2ea" stroke-width="2.5" />
    <circle cx="15" cy="35" r="5" fill="none" stroke="#f6f2ea" stroke-width="2.5" />
    <circle cx="37" cy="35" r="5" fill="none" stroke="#f6f2ea" stroke-width="2.5" />
    <circle cx="26" cy="27" r="4.5" fill="#bcf58d" />
    <text x="70" y="34" fill="#f6f2ea" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="3">TITAN <tspan fill="#bcf58d">AI</tspan></text>
  </g>

  <!-- Title & Copy -->
  <text x="100" y="270" fill="#f6f2ea" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">See what's coming.</text>
  <text x="100" y="335" fill="#bcf58d" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-style="italic" font-weight="700">Stay ahead.</text>
  
  <text x="100" y="415" fill="#a0b4a8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    AI-powered demand forecasting, inventory signals, risk alerts,
  </text>
  <text x="100" y="450" fill="#a0b4a8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    and smarter supply-chain decisions without black-box automation.
  </text>

  <!-- Badges / Tags at bottom -->
  <g transform="translate(100, 510)">
    <rect width="180" height="36" rx="18" fill="#182e25" stroke="#2a4e3c"/>
    <text x="90" y="23" fill="#bcf58d" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">XGBoost Forecasts</text>
  </g>
  <g transform="translate(300, 510)">
    <rect width="180" height="36" rx="18" fill="#182e25" stroke="#2a4e3c"/>
    <text x="90" y="23" fill="#bcf58d" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Anomaly Detection</text>
  </g>
  <g transform="translate(500, 510)">
    <rect width="180" height="36" rx="18" fill="#182e25" stroke="#2a4e3c"/>
    <text x="90" y="23" fill="#bcf58d" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Scenario Planning</text>
  </g>
</svg>
