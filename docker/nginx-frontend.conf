server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Landing page screenshots
    location ^~ /screenshots/ {
        root /usr/share/nginx/html/landing;
    }

    # Landing page direct assets fallback
    location ~* ^/(styles\.css|script\.js|refinements\.css|v9-sections\.css|v10-chain\.css|v11-risk\.css|v12-scenario\.css|v13-brief\.css|og-image\.svg|robots\.txt|sitemap\.xml)$ {
        root /usr/share/nginx/html/landing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Landing page direct folder route
    location /landing/ {
        alias /usr/share/nginx/html/landing/;
        try_files $uri $uri/ /landing/index.html;
    }

    # SPA app — serve React app
    location /app {
        try_files $uri $uri/ /index.html;
    }

    # All other SPA routes (dashboard, forecast, inventory, etc)
    location ~ ^/(dashboard|forecast|inventory|pipeline|alerts|products|reports|categories|anomalies|scenarios|admin|upload|settings) {
        try_files $uri $uri/ /index.html;
    }

    # Auth routes → SPA
    location /auth {
        try_files $uri $uri/ /index.html;
    }

    # Root → Landing page
    location = / {
        rewrite ^ /landing/index.html break;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        try_files $uri /landing$uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
