version: '3.9'

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:15-alpine
    container_name: df-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - df-network

  # ---- PostgreSQL Backup Sidecar ----
  postgres-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: df-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=demandforecaster
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_DIR=/backups
    volumes:
      - ./backups:/backups
    networks:
      - df-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: df-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - df-network

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: df-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models
    networks:
      - df-network

  # ---- Celery Worker ----
  celery_worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: df-celery-worker
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models
    networks:
      - df-network

  # ---- Celery Beat (Scheduler) ----
  celery_beat:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: df-celery-beat
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - celery_worker
    networks:
      - df-network

  # ---- Flower (Celery Monitoring) ----
  flower:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: df-flower
    restart: unless-stopped
    command: celery -A app.celery_app flower --port=5555 --broker=redis://:${REDIS_PASSWORD}@redis:6379/0 --basic_auth=admin:${FLOWER_PASSWORD}
    env_file:
      - .env
    depends_on:
      - celery_worker
      - redis
    networks:
      - df-network

  # ---- Frontend (React + Nginx) ----
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: df-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - df-network

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: df-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - df-network

volumes:
  postgres_data:

networks:
  df-network:
    driver: bridge
