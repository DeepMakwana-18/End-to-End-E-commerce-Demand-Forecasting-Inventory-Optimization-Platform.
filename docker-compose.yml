version: '3.9'

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:15-alpine
    container_name: df-postgres
    environment:
      POSTGRES_DB: demandforecaster
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - df-network

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: df-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - df-network

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: df-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/demandforecaster
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: production-secret-key-change-this
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ml/models:/app/ml/models
    networks:
      - df-network

  # ---- Frontend (React + Nginx) ----
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: df-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - df-network

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: df-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - df-network

volumes:
  postgres_data:

networks:
  df-network:
    driver: bridge
